<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vsionart — Brand & Identity Design</title>
  <meta name="description" content="Vsionart — Premium brand and identity design studio. We craft visual identities that transcend the ordinary.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #050505;
      --text: #f0efe8;
      --accent: #00e5a0;
      --accent-gold: #d4a017;
      --muted: rgba(240,239,232,0.4);
      --font-display: 'Anybody', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-mono);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HERO ─── */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ─── SLIDESHOW ─── */
    .slideshow { position: absolute; inset: 0; z-index: 0; }

    .slideshow .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.8s ease-in-out;
    }

    .slideshow .slide.active { opacity: 1; }

    .slideshow .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.4) saturate(1.15);
      transform: scale(1.06);
      animation: slowZoom 14s ease-in-out infinite alternate;
    }

    @keyframes slowZoom {
      0% { transform: scale(1.06); }
      100% { transform: scale(1.14); }
    }

    .slide:nth-child(2) img { animation-delay: -3s; }
    .slide:nth-child(3) img { animation-delay: -6s; }
    .slide:nth-child(4) img { animation-delay: -1s; }
    .slide:nth-child(5) img { animation-delay: -4s; }
    .slide:nth-child(6) img { animation-delay: -7s; }
    .slide:nth-child(7) img { animation-delay: -2s; }
    .slide:nth-child(8) img { animation-delay: -5s; }

    /* ─── OVERLAYS ─── */
    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(180deg, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0) 30%, rgba(5,5,5,0.55) 100%);
      pointer-events: none;
    }

    .hero-grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 128px;
      pointer-events: none;
    }

    /* ─── SLIDE INDICATORS ─── */
    .slide-indicators {
      position: absolute;
      bottom: 110px;
      right: 40px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 5px;
      opacity: 0;
      animation: fadeIn 1s ease 1.5s forwards;
    }

    .slide-indicators .dot {
      width: 2px;
      height: 14px;
      background: rgba(255,255,255,0.12);
      border-radius: 1px;
      transition: all 0.5s ease;
      cursor: pointer;
    }

    .slide-indicators .dot.active {
      height: 24px;
      background: var(--text);
    }

    /* ─── LOGO TOP ─── */
    .logo-top {
      position: absolute;
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      opacity: 0;
      animation: fadeDown 1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }

    .logo-top svg { width: 32px; height: 32px; }

    /* ─── BRAND NAME SPLIT ─── */
    .brand-left, .brand-right {
      position: absolute;
      font-family: var(--font-display);
      font-weight: 900;
      z-index: 5;
    }

    .brand-left {
      left: 40px;
      bottom: 50%;
      transform: translateY(50%);
      font-size: clamp(1.8rem, 3.5vw, 3rem);
      letter-spacing: 0.06em;
      text-transform: lowercase;
      color: var(--text);
      opacity: 0;
      animation: fadeSlideRight 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }

    .brand-right {
      right: 40px;
      bottom: 50%;
      transform: translateY(50%);
      font-size: clamp(1rem, 1.8vw, 1.5rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      opacity: 0;
      animation: fadeSlideLeft 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    }

    .brand-right .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      margin-left: 4px;
      vertical-align: middle;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.6); }
    }

    /* ─── CENTER CONTENT ─── */
    .center-content {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-top: 80px;
      opacity: 0;
      animation: cardIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
    }

    /* ─── CTA CARD — MINIMAL ─── */
    .cta-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 8px 10px 8px 8px;
      transition: border-color 0.3s ease;
    }

    .cta-card:hover { border-color: rgba(255,255,255,0.12); }

    .cta-thumb {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .cta-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cta-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--text);
    }

    .cta-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff;
      border: none;
      cursor: pointer;
      margin-left: 8px;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
      text-decoration: none;
    }

    .cta-whatsapp:hover {
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(255,255,255,0.15);
    }

    .cta-whatsapp svg {
      width: 18px;
      height: 18px;
      fill: #0a0a0a;
    }

    /* ─── BIO ─── */
    .bio {
      max-width: 340px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.58rem;
      line-height: 1.8;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.32);
    }

    /* ─── BOTTOM ─── */
    .hero-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 5;
      padding: 0 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .hero-links {
      display: flex;
      gap: 32px;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
    }

    .hero-links a {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.3s ease;
    }

    .hero-links a:hover { color: var(--text); }

    .hero-links a svg {
      width: 9px;
      height: 9px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero-meta {
      display: flex;
      gap: 20px;
      align-items: center;
      opacity: 0;
      animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 1.1s forwards;
    }

    .hero-meta span, .hero-meta a {
      font-family: var(--font-mono);
      font-size: 0.5rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .hero-meta a:hover { color: var(--text); }

    .hero-meta .sep {
      width: 3px;
      height: 3px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
    }

    /* ─── FOOTER ─── */
    .footer-bar {
      width: 100%;
      text-align: center;
      padding: 22px 20px;
      background: var(--bg);
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .footer-bar p {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    .footer-bar .sub {
      font-size: 0.48rem;
      color: rgba(255,255,255,0.12);
      margin-top: 4px;
      letter-spacing: 0.2em;
    }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeSlideRight {
      from { opacity: 0; transform: translateX(-30px) translateY(50%); }
      to { opacity: 1; transform: translateX(0) translateY(50%); }
    }
    @keyframes fadeSlideLeft {
      from { opacity: 0; transform: translateX(30px) translateY(50%); }
      to { opacity: 1; transform: translateX(0) translateY(50%); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translate(-50%, -15px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ─── TABLET ─── */
    @media (max-width: 768px) {
      .hero { min-height: 100vh; min-height: 100dvh; }

      .brand-left, .brand-right {
        bottom: auto;
        transform: none;
      }

      .brand-left {
        left: auto; right: auto;
        top: auto; bottom: 50%;
        left: 50%;
        transform: translateX(-50%) translateY(calc(50% - 100px));
        font-size: 2.2rem;
        text-align: center;
      }

      .brand-right {
        left: 50%;
        right: auto;
        top: auto; bottom: 50%;
        transform: translateX(-50%) translateY(calc(50% - 55px));
        font-size: 1rem;
        text-align: center;
      }

      .center-content { margin-top: 60px; }
      .slide-indicators { right: 16px; bottom: 30px; }
      .bio { max-width: 280px; }
    }

    /* ─── MOBILE ─── */
    @media (max-width: 480px) {
      .hero { min-height: 100vh; min-height: 100dvh; }

      .brand-left {
        font-size: 1.8rem;
        transform: translateX(-50%) translateY(calc(50% - 90px));
      }

      .brand-right {
        font-size: 0.85rem;
        transform: translateX(-50%) translateY(calc(50% - 50px));
        letter-spacing: 0.3em;
      }

      .center-content { margin-top: 50px; gap: 14px; }

      .cta-card {
        padding: 7px 9px 7px 7px;
        gap: 10px;
        border-radius: 10px;
      }

      .cta-thumb { width: 52px; height: 52px; border-radius: 6px; }
      .cta-label { font-size: 0.62rem; letter-spacing: 0.18em; }

      .cta-whatsapp {
        width: 36px;
        height: 36px;
        margin-left: 6px;
      }
      .cta-whatsapp svg { width: 15px; height: 15px; }

      .bio {
        max-width: 220px;
        font-size: 0.52rem;
        line-height: 1.7;
      }

      .slide-indicators { right: 12px; bottom: 24px; }
      .slide-indicators .dot { height: 10px; }
      .slide-indicators .dot.active { height: 18px; }

      .logo-top { top: 24px; }
      .logo-top svg { width: 26px; height: 26px; }
    }

    /* ─── SMALL PHONES ─── */
    @media (max-width: 360px) {
      .brand-left { font-size: 1.5rem; }
      .brand-right { font-size: 0.75rem; }
      .cta-thumb { width: 46px; height: 46px; }
      .cta-label { font-size: 0.58rem; }
      .bio { max-width: 200px; font-size: 0.48rem; }
    }

    /* ─── LANDSCAPE MOBILE ─── */
    @media (max-height: 500px) {
      .hero { min-height: 500px; }
      .brand-left { transform: translateX(-50%) translateY(calc(50% - 70px)); font-size: 1.4rem; }
      .brand-right { transform: translateX(-50%) translateY(calc(50% - 35px)); font-size: 0.7rem; }
      .center-content { margin-top: 30px; gap: 10px; }
      .logo-top { top: 16px; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="slideshow" id="slideshow">
      <div class="slide active"><img src="images/img1.jpg" alt="Vsionart" /></div>
      <div class="slide"><img src="images/img2.jpg" alt="Vsionart" /></div>
      <div class="slide"><img src="images/img3.jpg" alt="Vsionart" /></div>
      <div class="slide"><img src="images/img4.jpg" alt="Vsionart" /></div>
      <div class="slide"><img src="images/img5.jpg" alt="Vsionart" /></div>
      <div class="slide"><img src="images/img6.jpg" alt="Vsionart" /></div>
      <div class="slide"><img src="images/img7.jpg" alt="Vsionart" /></div>
      <div class="slide"><img src="images/img8.jpg" alt="Vsionart" /></div>
    </div>

    <div class="hero-overlay"></div>
    <div class="hero-grain"></div>
    <div class="slide-indicators" id="indicators"></div>

    <div class="logo-top">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00e5a0"/>
            <stop offset="100%" stop-color="#d4a017"/>
          </linearGradient>
        </defs>
        <polygon points="20,2 6,16 20,12 34,16" fill="url(#lg)" opacity="0.9"/>
        <polygon points="6,16 20,38 20,12" fill="#00e5a0" opacity="0.45"/>
        <polygon points="34,16 20,38 20,12" fill="#d4a017" opacity="0.35"/>
      </svg>
    </div>

    <div class="brand-left">vsion</div>
    <div class="brand-right">art<span class="dot"></span></div>

    <div class="center-content">
      <div class="cta-card">
        <div class="cta-thumb">
          <img src="images/img3.jpg" alt="Preview" />
        </div>
        <span class="cta-label">Let's Talk</span>
        <a href="https://wa.me/16319723353" target="_blank" rel="noopener noreferrer" class="cta-whatsapp" aria-label="Chat on WhatsApp">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
          </svg>
        </a>
      </div>

      <p class="bio">
        We design brands that move people.<br>
        Strategy · Identity · Digital Experience
      </p>
    </div>

  </section>

  <script>
    const slides = document.querySelectorAll('.slideshow .slide');
    const indicatorContainer = document.getElementById('indicators');
    let current = 0;
    const total = slides.length;

    for (let i = 0; i < total; i++) {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (i === 0) dot.classList.add('active');
      dot.addEventListener('click', () => goToSlide(i));
      indicatorContainer.appendChild(dot);
    }

    const dots = document.querySelectorAll('.slide-indicators .dot');

    function goToSlide(index) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = index;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
    }

    setInterval(() => goToSlide((current + 1) % total), 5000);
  </script>
</body>
</html>
